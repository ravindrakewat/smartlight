name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Typecheck, Lint, Format, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Check translations (Hindi / English)
        run: npm run check:i18n

      - name: Run tests
        run: npm run test

      - name: Build supported applications
        run: npm run build

      - name: Bundle mobile app (Android + iOS)
        run: npm run export -w @smart-light/mobile

  firmware:
    name: Firmware build (ESP32-S3, ESP-IDF v5.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pure-C modules are unit-tested on the host before the full ESP-IDF build.
      - name: Host unit tests (astronomical clock)
        working-directory: firmware/street-light-controller
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Imain/include test/test_sun.c main/sl_sun.c -lm -o test_sun
          ./test_sun

      - name: Build street-light-controller
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: firmware/street-light-controller
