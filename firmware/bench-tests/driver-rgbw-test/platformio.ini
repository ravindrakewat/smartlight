; Bench test: driver dimming + RGBW colour channels (Arduino framework).
; Not production firmware. Production code lives in ../../street-light-controller (ESP-IDF).
;
; Pick the env that matches your board in the VS Code status bar (or `pio run -e <env>`).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.2

; Classic ESP32 dev board (ESP32-WROOM-32, CP2102 / CH340 USB chip)
[env:esp32dev]
board = esp32dev

; ESP32-S3 dev board
[env:esp32s3]
board = esp32-s3-devkitc-1

; ESP32-C3 dev board
[env:esp32c3]
board = esp32-c3-devkitm-1
