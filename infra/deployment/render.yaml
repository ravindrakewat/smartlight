# Render Blueprint — Smart Street Light Management System
# Do not commit real secrets here; configure secret values via the Render Dashboard /
# Environment Groups (`sync: false` entries) when deploying.
#
# Region: Render has no India region. Singapore is the closest (lowest latency for
# Indore / Delhi). Confirm data-residency requirements with each municipal tender.

services:
  - type: web
    name: smart-light-api
    runtime: node
    plan: starter
    region: singapore
    # --include=dev is required: NODE_ENV=production would otherwise skip devDependencies
    # (typescript, @smart-light/config) and the TypeScript build would fail.
    buildCommand: npm ci --include=dev && npm run build:packages && npm run build -w @smart-light/api
    # Apply pending database migrations before the new version starts serving traffic.
    preDeployCommand: npm run migrate:deploy -w @smart-light/db
    startCommand: npm run start -w @smart-light/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # PORT is injected by Render automatically; do not hardcode it.
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SERVICE_NAME
        value: smart-light-api
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CORS_ORIGINS
        sync: false
      # Use the INTERNAL database URL from the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Random 32+ character signing key, generated once by Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Parent domain shared with the web consoles, e.g. .smartlight.example.in
      - key: COOKIE_DOMAIN
        sync: false
      # Set to msg91 once DLT templates are approved (see apps/api/.env.example).
      - key: SMS_PROVIDER
        value: console
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_OTP
        sync: false
      - key: MSG91_TEMPLATE_COMPLAINT_RESOLVED
        sync: false

  # IoT worker: MQTT bridge between the controllers and the platform (same code as the API,
  # different entry point). Render background workers need a paid instance type.
  - type: worker
    name: smart-light-iot-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:packages && npm run build -w @smart-light/api
    startCommand: npm run start:worker -w @smart-light/api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Same database and secret as the API (use the INTERNAL database URL).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      # Broker (EMQX Cloud or a VPS in India): mqtts://host:8883 and a backend-only credential
      # whose ACL allows publish/subscribe on sl/v1/#.
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

  # Future: smart-light-queue-worker (SLA breach alerts, reports)
