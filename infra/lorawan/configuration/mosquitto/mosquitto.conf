# Mosquitto for the ChirpStack staging stack. UNTESTED.
persistence true
persistence_location /mosquitto/data/

# Internal listener for ChirpStack and the gateway bridge (Docker network only:
# port 1883 is not published in docker-compose.yml).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS listener for the platform worker over the internet.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
