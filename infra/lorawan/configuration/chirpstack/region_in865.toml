# IN865 (865–867 MHz) region for ChirpStack v4. UNTESTED: compare with the
# region file shipped in the chirpstack-docker repository of the exact ChirpStack
# version you deploy, and with the gateway's channel plan, before use.

[[regions]]
  id = "in865"
  description = "IN865"
  common_name = "IN865"

  [regions.gateway]
    force_gws_private = false

    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix = "in865"
        server = "tcp://$MQTT_BROKER_HOST:1883"
        username = "chirpstack"
        password = "$CHIRPSTACK_MQTT_PASSWORD"
        qos = 0
        clean_session = false
        client_id = ""

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    # IN865 RX2: 866.550 MHz, DR2.
    rx2_dr = 2
    rx2_frequency = 866550000
    rx2_prefer_on_rx1_dr_lt = 0
    rx2_prefer_on_link_budget = false
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 5
